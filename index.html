  <style>
    :root{--accent:#22c55e;--accent-glow:rgba(34,197,94,0.5);--bg-main:#0f1015;--bg-header:rgba(15,16,21,0.92);--bg-card:#181a20;--bg-card-hover:#222632;--bg-pill:#262933;--text-primary:#f8fafc;--text-secondary:#94a3b8;--border:rgba(255,255,255,0.1)}
    *{box-sizing:border-box;margin:0;padding:0;font-family:Inter,sans-serif}
    body{background:var(--bg-main);color:var(--text-primary);min-height:100vh;padding-bottom:90px;overflow-x:hidden}
    @keyframes zoomFade{from{opacity:0;transform:scale(0.97) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
    @keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes pulseGlow{0%,100%{box-shadow:0 0 15px var(--accent-glow)}50%{box-shadow:0 0 30px var(--accent-glow)}}
    @keyframes shimmer{0%{transform:translateX(-100%) skewX(-15deg)}100%{transform:translateX(250%) skewX(-15deg)}}

    .vv-brand span{color:var(--accent)}
    .header-controls{display:flex;align-items:center;gap:8px}
    .btn-control,select.color-select{background:var(--bg-pill);color:var(--text-primary);border:1px solid var(--border);padding:7px 14px;border-radius:9999px;font-size:0.8rem;font-weight:700;cursor:pointer;transition:0.2s}
    .btn-nav.active{background:var(--accent)!important;color:#fff!important}
    .btn-login{background:var(--text-primary)!important;color:var(--bg-main)!important;font-weight:800!important}
    .btn-back{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:9999px;font-size:0.8rem;font-weight:800;display:none;cursor:pointer}
    .cta-wrapper{max-width:1250px;margin:0 auto;padding:1.2rem 1rem 0 1rem}
    .cta-banner{display:flex;justify-content:space-between;align-items:center;gap:1rem;background:linear-gradient(135deg,var(--bg-card),var(--bg-card-hover));border:1px solid var(--border);border-left:5px solid var(--accent);border-radius:16px;padding:16px 22px;animation:zoomFade 0.7s both;position:relative;overflow:hidden}
    .cta-banner::before{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.08),transparent);animation:shimmer 3.5s infinite}

    .vv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1.4rem}

    .vv-actions{display:flex;align-items:center;gap:10px;margin:14px 0 16px 0;flex-wrap:wrap}
    .vv-action-group{display:flex;align-items:center;background:var(--bg-pill);border:1px solid var(--border);border-radius:9999px;overflow:hidden}

<script>
let playerInstance=null,currentVideoIndex=0,currentChannelFilter=null;
const COLOR_PALETTE={verde:{color:"#22c55e",glow:"rgba(34,197,94,0.5)"},morado:{color:"#8b5cf6",glow:"rgba(139,92,246,0.5)"},azul:{color:"#3b82f6",glow:"rgba(59,130,246,0.5)"},rojo:{color:"#ef4444",glow:"rgba(239,68,68,0.5)"},rosado:{color:"#ec4899",glow:"rgba(236,72,153,0.5)"}};

let vvLikes = JSON.parse(localStorage.getItem('vv_likes')||'{}');
let vvDislikes = JSON.parse(localStorage.getItem('vv_dislikes')||'{}');
let vvSaved = JSON.parse(localStorage.getItem('vv_saved')||'[]');

function getBaseLikes(video){
  if(!video) return 0;
  return typeof video.likes === 'number' ? video.likes : 0;
}
function getBaseDislikes(video){
  if(!video) return 0;
  return typeof video.dislikes === 'number' ? video.dislikes : 0;
}

function getChannelInfoByName(name){if(typeof CHANNELS==="undefined") return null; const key=name.trim().toLowerCase(); return CHANNELS.find(c=>c.name.toLowerCase()===key);}
function parseFecha(fechaStr){
  if(!fechaStr) return 0;
  const meses={enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,octubre:10,noviembre:11,diciembre:12};
  const str=fechaStr.toLowerCase();
  const match=str.match(/(\d{1,2})\s+de\s+([a-záéíóúñ]+)(?:\s+de\s+(\d{4}))?/);
  if(match){
    const dia=parseInt(match[1])||1;
    let mesNombre=match[2].normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    const mes=meses[mesNombre]||1;
    const anio=match[3]?parseInt(match[3]):2024;
    return new Date(anio,mes-1,dia).getTime();
  }
  const yearMatch=str.match(/(\d{4})/);
  if(yearMatch) return new Date(parseInt(yearMatch[1]),0,1).getTime();
  return 0;
}
function detenerVideo(){
  if(!playerInstance) return;
  try{playerInstance.api("pause");playerInstance.api("stop");}catch(e){
    try{const v=document.querySelector("#playerContainer video"); if(v){v.pause(); v.src="";}}catch(e2){}
  }
}

function updateActionUI(){
  const likeBtn=document.getElementById('btnLike');
  const dislikeBtn=document.getElementById('btnDislike');
  const saveBtn=document.getElementById('btnSave');
  const likeCountEl=document.getElementById('likeCount');
  if(!likeBtn || !likeCountEl) return;
  const id=currentVideoIndex;
  const v=PLAYLIST_VIDEOS[id];
  const baseLikes=getBaseLikes(v);
  const finalLikes = baseLikes + (vvLikes[id]?1:0);
  likeCountEl.textContent = finalLikes.toLocaleString('es-MX');
  likeBtn.classList.toggle('active', !!vvLikes[id]);
  dislikeBtn.classList.toggle('active', !!vvDislikes[id]);
  const isSaved=vvSaved.includes(id);
  if(saveBtn){
    saveBtn.classList.toggle('vvp-save-active', isSaved);
    const off=saveBtn.querySelector('.ic-save-off');
    const on=saveBtn.querySelector('.ic-save-on');
    if(off) off.style.display=isSaved?'none':'block';
    if(on) on.style.display=isSaved?'block':'none';
    const sp=saveBtn.querySelector('span');
    if(sp) sp.textContent=isSaved?'Guardado':'Guardar';
  }
}

function setupActions(){
  const likeBtn=document.getElementById('btnLike');
  const dislikeBtn=document.getElementById('btnDislike');
  const shareBtn=document.getElementById('btnShare');
  const saveBtn=document.getElementById('btnSave');
  if(!likeBtn || likeBtn._bound) return;
  likeBtn._bound=true;

  likeBtn.addEventListener('click',(e)=>{
    e.preventDefault(); e.stopPropagation();
    const id=currentVideoIndex;
    if(vvLikes[id]) delete vvLikes[id];
    else { vvLikes[id]=true; delete vvDislikes[id]; }
    localStorage.setItem('vv_likes', JSON.stringify(vvLikes));
    localStorage.setItem('vv_dislikes', JSON.stringify(vvDislikes));
    updateActionUI();
    likeBtn.animate([{transform:'scale(1)'},{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:200});
  });
  dislikeBtn.addEventListener('click',(e)=>{
    e.preventDefault(); e.stopPropagation();
    const id=currentVideoIndex;
    if(vvDislikes[id]) delete vvDislikes[id];
    else { vvDislikes[id]=true; delete vvLikes[id]; }
    localStorage.setItem('vv_likes', JSON.stringify(vvLikes));
    localStorage.setItem('vv_dislikes', JSON.stringify(vvDislikes));
    updateActionUI();
  });
  shareBtn.addEventListener('click', async(e)=>{
    e.preventDefault(); e.stopPropagation();
    const v=PLAYLIST_VIDEOS[currentVideoIndex];
    const url=location.href.split('#')[0]+'#video='+currentVideoIndex;
    try{
      if(navigator.share) await navigator.share({title:v.titulo, url});
      else { await navigator.clipboard.writeText(url); const s=shareBtn.querySelector('span'); s.textContent='Enlace copiado'; setTimeout(()=>s.textContent='Compartir',1500); }
    }catch(err){
      try{ await navigator.clipboard.writeText(url); const s=shareBtn.querySelector('span'); s.textContent='Enlace copiado'; setTimeout(()=>s.textContent='Compartir',1500); }catch(e2){}
    }
  });
  saveBtn.addEventListener('click',(e)=>{
    e.preventDefault(); e.stopPropagation();
    const id=currentVideoIndex;
    if(vvSaved.includes(id)) vvSaved=vvSaved.filter(x=>x!==id);
    else vvSaved.push(id);
    localStorage.setItem('vv_saved', JSON.stringify(vvSaved));
    updateActionUI();
  });
  updateActionUI();
}

window.addEventListener("load",()=>{
  const homeView=document.getElementById("homeView"),channelsView=document.getElementById("channelsView"),channelDetailView=document.getElementById("channelDetailView"),playerView=document.getElementById("playerView");
  const homeGrid=document.getElementById("homeGrid"),channelsGrid=document.getElementById("channelsGrid"),channelVideosGrid=document.getElementById("channelVideosGrid"),sidebarList=document.getElementById("sidebarList");
  const btnBack=document.getElementById("btnBack"),btnBackM=document.getElementById("btnBackM"),btnBackCanales=document.getElementById("btnBackCanales");
  const videoTitle=document.getElementById("videoTitle"),videoDesc=document.getElementById("videoDesc"),channelNameEl=document.getElementById("channelName"),videoDate=document.getElementById("videoDate"),detailSubsPlayer=document.getElementById("detailSubsPlayer");
  const colorPicker=document.getElementById("colorPicker");

  function aplicarColor(val){const sel=COLOR_PALETTE[val]; if(sel){document.documentElement.style.setProperty("--accent",sel.color);document.documentElement.style.setProperty("--accent-glow",sel.glow);}}
  colorPicker.onchange=e=>aplicarColor(e.target.value);
  document.getElementById("btnLogin").addEventListener("click",e=>e.preventDefault());

  if(typeof PLAYLIST_VIDEOS==="undefined"||PLAYLIST_VIDEOS.length===0){homeGrid.innerHTML="<p style='padding:20px;text-align:center'>No hay videos</p>";return;}

  function hideAll(){
    detenerVideo();
    [homeView,channelsView,channelDetailView,playerView].forEach(v=>v.classList.remove("active"));
    document.querySelectorAll(".btn-nav").forEach(b=>b.classList.remove("active"));
    btnBack.style.display="none"; btnBackM.style.display="none";
  }
  function verInicio(){ 
    hideAll(); 
    homeView.classList.add("active"); 
    document.getElementById("btnNavInicio").classList.add("active"); 
    document.getElementById("btnNavInicioM").classList.add("active"); 
    window.scrollTo({top:0,behavior:'instant'}); 
  }
  function verCanales(){ 
    hideAll(); 
    channelsView.classList.add("active"); 
    document.getElementById("btnNavCanales").classList.add("active"); 
    document.getElementById("btnNavCanalesM").classList.add("active"); 
    renderCanales(); 
    window.scrollTo({top:0,behavior:'instant'}); 
  }
  function verCanalDetalle(canalNombre){
    hideAll(); 
    channelDetailView.classList.add("active"); 
    btnBack.style.display="inline-flex"; btnBackM.style.display="inline-flex";
    const info=getChannelInfoByName(canalNombre);
    document.getElementById("detailName").textContent=info?info.name:canalNombre;
    document.getElementById("detailAvatar").textContent=(info?info.name:canalNombre).charAt(0).toUpperCase();
    document.getElementById("detailSubs").textContent=info?info.subs:"";
    const videosDelCanal=PLAYLIST_VIDEOS.map((v,i)=>({...v,_idx:i,_time:parseFecha(v.fecha)})).filter(v=>v.canal.trim().toLowerCase()===canalNombre.trim().toLowerCase()).sort((a,b)=>b._time - a._time);
    document.getElementById("detailCount").textContent=videosDelCanal.length+" videos • Más nuevo primero";
    channelVideosGrid.innerHTML="";
    videosDelCanal.forEach((v,pos)=>{const card=crearCardVideo(v,v._idx,pos*0.06); channelVideosGrid.appendChild(card);});
    currentChannelFilter=canalNombre;
  }
  function crearCardVideo(v,realIndex,delay=0){
    const card=document.createElement("div"); 
    card.className="vv-card"; 
    card.style.animationDelay=delay+"s";
    const poster=v.poster?`style="background-image:url('${v.poster}')"`:'';
    const initial=(v.canal||"C")[0].toUpperCase(); 
    const dur=v.duracion||"00:00";
    const safeCanal=v.canal.replace(/'/g,"\\'");
    const fechaCorta=v.fecha?v.fecha.replace('Subido el ',''):'';
    card.innerHTML=`<div class="vv-thumb-container" ${poster}><div class="play-badge"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div><div class="duration-tag">${dur}</div></div><div class="vv-card-body"><div class="vv-avatar" onclick="event.stopPropagation(); window.verCanalDesdeCard('${safeCanal}')">${initial}</div><div class="vv-card-info"><h3 class="vv-card-title">${v.titulo}</h3><div class="vv-sub-text clickable-canal" onclick="event.stopPropagation(); window.verCanalDesdeCard('${safeCanal}')">${v.canal} • ${fechaCorta}</div></div></div>`;
    card.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      verReproductor(realIndex);
    });
    return card;
  }
  function renderHome(){
    homeGrid.innerHTML="";
    PLAYLIST_VIDEOS.forEach((v,i)=>{const card=crearCardVideo(v,i,i*0.06); homeGrid.appendChild(card);});
  }
  function renderCanales(){
    channelsGrid.innerHTML="";
    if(typeof CHANNELS==="undefined"){channelsGrid.innerHTML="Falta channel.js";return;}
    const conteo={}; PLAYLIST_VIDEOS.forEach(v=>{const k=v.canal.trim().toLowerCase();conteo[k]=(conteo[k]||0)+1;});
    CHANNELS.forEach((ch,idx)=>{
      const count=conteo[ch.name.toLowerCase()]||0; if(count===0) return;
      const initial=ch.name.charAt(0).toUpperCase();
      const card=document.createElement("div"); 
      card.className="channel-card"; 
      card.style.animationDelay=idx*0.05+"s";
      card.innerHTML=`<div class="channel-avatar-big">${initial}</div><h3>${ch.name}</h3><div style="font-size:0.8rem;color:var(--text-secondary)">${ch.subs||''}</div><div style="font-size:0.75rem;background:var(--bg-pill);padding:4px 10px;border-radius:9999px">${count} videos</div>`;
      card.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        verCanalDetalle(ch.name);
      }); 
      channelsGrid.appendChild(card);
    });
  }
  function renderRecomendadosRandom(excluirIndex){
    sidebarList.innerHTML="";
    const videoActual=PLAYLIST_VIDEOS[excluirIndex];
    const canalActual=videoActual.canal.trim().toLowerCase();
    let indices=PLAYLIST_VIDEOS.map((_,i)=>i).filter(i=>i!==excluirIndex && PLAYLIST_VIDEOS[i].canal.trim().toLowerCase()===canalActual);
    if(indices.length<10){
      let otros=PLAYLIST_VIDEOS.map((_,i)=>i).filter(i=>i!==excluirIndex && !indices.includes(i));
      for(let i=otros.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[otros[i],otros[j]]=[otros[j],otros[i]];}
      indices=indices.concat(otros).slice(0,10);
    }else{
      for(let i=indices.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[indices[i],indices[j]]=[indices[j],indices[i]];}
      indices=indices.slice(0,10);
    }
    indices.forEach((idx,pos)=>{
      const v=PLAYLIST_VIDEOS[idx];
      const item=document.createElement("div"); 
      item.className="side-item"; 
      item.style.animationDelay=pos*0.05+"s";
      const poster=v.poster?`style="background-image:url('${v.poster}')"`:'';
      item.innerHTML=`<div class="side-thumb" ${poster}></div><div style="flex:1;min-width:0"><h4 style="font-size:0.82rem;font-weight:800;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${v.titulo}</h4><div class="vv-sub-text">${v.canal}</div></div>`;
      item.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        cargarVideo(idx);
      }); 
      sidebarList.appendChild(item);
    });
  }
  function verReproductor(i){ 
    hideAll(); 
    playerView.classList.add("active"); 
    btnBack.style.display="inline-flex"; btnBackM.style.display="inline-flex"; 
    cargarVideo(i); 
    window.scrollTo({top:0,behavior:'instant'}); 
  }
  function cargarVideo(index){
    currentVideoIndex=index;
    const v=PLAYLIST_VIDEOS[index];
    const info=getChannelInfoByName(v.canal);
    videoTitle.textContent=v.titulo;
    videoDesc.textContent=v.descripcion && v.descripcion.trim()!=="" ? v.descripcion : "Sin descripción";
    videoDesc.style.display="block";
    channelNameEl.textContent=v.canal;
    videoDate.textContent=v.fecha||"";
    detailSubsPlayer.textContent=info?info.subs:(v.suscriptores||"");
    channelNameEl.onclick=()=>verCanalDetalle(v.canal);
    renderRecomendadosRandom(index);
    // ✅ Usa la función de comments.js en lugar de la local
    if (typeof renderComentarios === 'function') {
      renderComentarios(index);
    }
    updateActionUI();
    const cfg={id:"playerContainer",file:v.url,title:v.titulo,poster:v.poster||"",autoplay:1};
    if(playerInstance){try{playerInstance.api("play",v.url)}catch(e){playerInstance=new Playerjs(cfg)}}else{playerInstance=new Playerjs(cfg)}
  }
  window.verCanalDesdeCard=(nombre)=>{verCanalDetalle(nombre);};
  
  document.getElementById("logoHome").addEventListener('click', e => { e.preventDefault(); verInicio(); });
  document.getElementById("btnNavInicio").addEventListener('click', e => { e.preventDefault(); verInicio(); });
  document.getElementById("btnNavInicioM").addEventListener('click', e => { e.preventDefault(); verInicio(); });
  document.getElementById("btnNavCanales").addEventListener('click', e => { e.preventDefault(); verCanales(); });
  document.getElementById("btnNavCanalesM").addEventListener('click', e => { e.preventDefault(); verCanales(); });
  btnBack.addEventListener('click', e => { e.preventDefault(); verInicio(); });
  btnBackM.addEventListener('click', e => { e.preventDefault(); verInicio(); });
  btnBackCanales.addEventListener('click', e => { e.preventDefault(); verCanales(); });

  setupActions();
  renderHome();
});
</script>
